name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npx --yes -p typescript@5.6.3 tsc --noEmit -p .
      - name: Bundle like LM Studio does
        run: npx --yes esbuild@0.24.0 src/index.ts --bundle --platform=node --format=cjs --packages=external --outfile=dist/index.js
      - name: Unit tests
        run: npm test
      - name: Smoke test (the bundle loads and exports main)
        run: node -e "const m = require('./dist/index.js'); if (typeof m.main !== 'function') { console.error('main() is missing'); process.exit(1); } console.log('ok');"
      - name: Check extras
        working-directory: .
        shell: bash
        run: |
          node --check extras/disable-thinking/disable-thinking.mjs
          for f in extras/macos-mlx-memory/*.command; do
            if head -1 "$f" | grep -q zsh; then
              if command -v zsh >/dev/null; then zsh -n "$f"; fi
            else
              bash -n "$f"
            fi
          done
